[project]
name = "voxbabel-backend"
version = "0.1.0"
description = "VoxBabel: Real-Time AI-Powered Multilingual Voice Translation"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # ── AI Providers (Local) ──
    "faster-whisper>=1.1",         # STT — local Whisper
    "fast-langdetect>=0.3",        # LID — fastText lid.176
    "transformers>=4.45",          # MT  — OPUS-MT models
    "sentencepiece>=0.2",          # MT  — tokenizer for OPUS-MT
    "piper-tts>=1.2",              # TTS — local Piper

    # ── AI Providers (Cloud — optional) ──
    "google-cloud-speech>=2.28",   # STT — Google Cloud
    "google-cloud-translate>=3.18",# MT  — Google Translate
    "google-cloud-texttospeech>=2.20", # TTS — Google Cloud
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
